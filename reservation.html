<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINDIE - Reserve a Table</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #3d2b1f; --accent: #b5894b; --bg: #fdfaf5; --success: #465c47; --danger: #e74c3c; }
        body { margin: 0; font-family: 'Mitr', sans-serif; background: var(--bg); color: var(--primary); }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 8%; background: #fff; box-shadow: 0 2px 15px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; }
        .logo-img { height: 45px; width: 45px; border-radius: 50%; border: 1.5px solid var(--accent); object-fit: cover; }
        .container { padding: 30px 5%; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        @media (max-width: 850px) { .container { grid-template-columns: 1fr; } }
        .card { background: #fff; padding: 30px; border-radius: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.04); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px; }
        input, select { width: 100%; padding: 15px; border: 1.5px solid #f0f0f0; border-radius: 15px; background: #fafafa; font-family: 'Mitr'; outline: none; }
        .table-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 10px; margin-top: 15px; }
        .t-box { padding: 12px; border: 1.5px solid #eee; border-radius: 12px; text-align: center; cursor: pointer; background: #fff; font-size: 13px; transition: 0.3s; position: relative; }
        .t-box.selected { background: var(--accent); color: white; border-color: var(--accent); }
        .t-box.occupied { background: #fee2e2; color: #ef4444; cursor: not-allowed; border-color: #fecaca; }
        .t-box.occupied::after { content: "จองแล้ว"; position: absolute; bottom: 2px; left: 0; width: 100%; font-size: 7px; font-weight: 600; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 18px; border-radius: 50px; width: 100%; font-size: 17px; cursor: pointer; margin-top: 20px; }
        .h-card { padding: 20px; border-bottom: 1px solid #eee; background: #fafafa; border-radius: 15px; margin-bottom: 15px; border-left: 5px solid var(--success); }
    </style>
</head>
<body>
    <header>
        <div style="display:flex; align-items:center; gap:12px;"><img src="image/a1.jpg" class="logo-img"><span style="font-family:'Playfair Display'; font-weight:700; font-size: 24px;">KINDIE</span></div>
        <nav class="nav-links" style="font-size:14px;"><a href="index.html" style="text-decoration:none; color:var(--primary);">หน้าหลัก</a></nav>
    </header>
    <div class="container">
        <div class="left">
            <div class="card">
                <h2 style="font-family:'Playfair Display'; color: var(--success); margin-top:0;">Book a Table</h2>
                <div class="form-group"><label>เบอร์โทรศัพท์</label><input type="tel" id="cPhone" maxlength="10" placeholder="0XXXXXXXXX"></div>
                <div class="form-group"><label>ชื่อผู้จอง</label><input type="text" id="cName" placeholder="ระบุชื่อของคุณ"></div>
                <div class="form-group">
                    <label>เลือกโต๊ะ (A=ในร้าน, B=นอกร้าน)</label>
                    <div id="grid" class="table-grid"></div>
                </div>
                <button class="btn-submit" onclick="doBook()">ยืนยันการจองที่นั่ง</button>
            </div>
        </div>
        <div class="right">
            <div class="card" id="hSection" style="display:none;">
                <h3 style="margin-top:0;">🕒 รายการจองของคุณ</h3>
                <div id="hList"></div>
            </div>
        </div>
    </div>
    <script>
        let selectedT = null;
        window.onload = () => { render(); if(localStorage.getItem('lastP')) { document.getElementById('cPhone').value = localStorage.getItem('lastP'); loadH(); } };
        function render() {
            const g = document.getElementById('grid'); g.innerHTML = '';
            const booked = JSON.parse(localStorage.getItem('kindieReservations')) || [];
            for(let i=1; i<=21; i++) {
                const id = i <= 9 ? `A-${i.toString().padStart(2,'0')}` : `B-${(i-9).toString().padStart(2,'0')}`;
                const isOcc = booked.some(b => b.table === id && b.status === 'จองสำเร็จ') || Math.random() < 0.2;
                g.innerHTML += `<div class="t-box ${isOcc ? 'occupied' : ''}" id="t${id}" onclick="sel('${id}')">${id}</div>`;
            }
        }
        function sel(id) {
            if(document.getElementById('t'+id).classList.contains('occupied')) return;
            selectedT = id; document.querySelectorAll('.t-box').forEach(b => b.classList.remove('selected'));
            document.getElementById('t'+id).classList.add('selected');
        }
        function doBook() {
            const p = document.getElementById('cPhone').value; const n = document.getElementById('cName').value;
            if(p.length<10 || !n || !selectedT) { alert("กรุณากรอกข้อมูลและเลือกโต๊ะค่ะ"); return; }
            let all = JSON.parse(localStorage.getItem('kindieReservations')) || [];
            all.push({ phone:p, name:n, table:selectedT, status:'จองสำเร็จ', time:new Date().toLocaleString() });
            localStorage.setItem('kindieReservations', JSON.stringify(all));
            localStorage.setItem('lastP', p); alert("จองสำเร็จ!"); location.reload();
        }
        function loadH() {
            const p = localStorage.getItem('lastP'); const all = JSON.parse(localStorage.getItem('kindieReservations')) || [];
            const my = all.filter(r => r.phone === p);
            if(my.length>0) { document.getElementById('hSection').style.display='block'; document.getElementById('hList').innerHTML = my.reverse().map(r => `<div class="h-card"><b>โต๊ะ ${r.table}</b><br><small>${r.time}</small></div>`).join(''); }
        }
    </script>
</body>
</html>
