<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINDIE PAY</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Mitr', sans-serif; background: #4a148c; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .app-screen { background: white; width: 340px; border-radius: 35px; padding: 30px; text-align: center; box-shadow: 0 15px 40px rgba(0,0,0,0.3); border: 8px solid #333; }
        .amount-box { background: #f8f9fa; padding: 25px; border-radius: 20px; margin: 25px 0; }
        .btn-pay { background: #4a148c; color: white; border: none; padding: 18px; width: 100%; border-radius: 50px; font-size: 1.1rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="app-screen" id="payScreen">
        <h2 style="color:#4a148c;">💸 KINDIE PAY</h2>
        <div class="amount-box">
            <div style="font-size:14px; color:#888;">ยอดเงินโอน</div>
            <div style="font-size:2.5rem; font-weight:600;" id="amt">฿0</div>
        </div>
        <button class="btn-pay" onclick="payNow()">ยืนยันชำระเงิน</button>
    </div>

    <div class="app-screen" id="success" style="display:none;">
        <div style="font-size:70px; color:#2ecc71;">✓</div>
        <h2>สำเร็จ</h2>
        <p>ออเดอร์ส่งเข้าครัวแล้วค่ะ</p>
        <button class="btn-pay" onclick="window.close()" style="background:#eee; color:#333;">ปิดหน้านี้</button>
    </div>

    <script>
        const amtValue = new URLSearchParams(window.location.search).get('amt') || '0';
        document.getElementById('amt').innerText = "฿" + parseFloat(amtValue).toLocaleString();
        function payNow() {
            document.getElementById('payScreen').style.display = 'none';
            document.getElementById('success').style.display = 'block';
        }
    </script>
</body>
</html>
