<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINDIE PAY - ระบบชำระเงินจำลอง</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Mitr', sans-serif; background: #4a148c; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .payment-screen { background: white; width: 350px; border-radius: 40px; padding: 40px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .success-circle { width: 100px; height: 100px; background: #2ecc71; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; color: white; font-size: 60px; }
        .amount-box { background: #f8f9fa; padding: 20px; border-radius: 20px; margin: 25px 0; }
        .amount { font-size: 2.5rem; font-weight: 600; color: #333; }
        .btn-pay { background: #4a148c; color: white; border: none; padding: 18px; width: 100%; border-radius: 50px; font-size: 1.1rem; cursor: pointer; transition: 0.3s; font-family: 'Mitr'; }
        /* ปรับสีปุ่มให้น่าดึงดูดขึ้น */
        .btn-close { background: #4a148c; color: white; border: none; padding: 15px; width: 100%; border-radius: 50px; margin-top: 15px; cursor: pointer; font-family: 'Mitr'; transition: 0.3s; }
        .btn-close:hover { background: #6a1b9a; }
    </style>
</head>
<body>
    <div id="payScreen" class="payment-screen">
        <h2 style="color:#4a148c; margin-top:0;">💸 ชำระเงิน</h2>
        <p>โอนเงินให้ ร้านอาหารคุณใจดี</p>
        <div class="amount-box">
            <div style="font-size:14px; color:#888;">ยอดเงินที่ต้องโอน</div>
            <div class="amount" id="amtDisplay">฿0</div>
        </div>
        <button class="btn-pay" onclick="payNow()">ยืนยันการโอนเงิน</button>
    </div>

    <div id="successScreen" class="payment-screen" style="display:none;">
        <div class="success-circle">✓</div>
        <h2 style="color:#333;">ชำระเงินสำเร็จ</h2>
        <p style="color:#666;">ขอบคุณที่ใช้บริการค่ะ</p>
        <button class="btn-close" onclick="goToCheckout()">กลับสู่หน้าร้าน</button>
    </div>

    <script>
        // ดึงยอดเงินจาก URL
        const params = new URLSearchParams(window.location.search);
        const amt = params.get('amt') || '0';
        document.getElementById('amtDisplay').innerText = "฿" + parseFloat(amt).toLocaleString();

        function payNow() {
            document.getElementById('payScreen').style.display = 'none';
            document.getElementById('successScreen').style.display = 'block';
        }

        function goToCheckout() {
            // 1. แจ้งเตือนหน้าหลักว่าจ่ายเงินสำเร็จแล้ว
            localStorage.setItem('paymentDone', 'true');
            
            // 2. เด้งกลับไปที่หน้า checkout.html ทันที
            window.location.href = "checkout.html";
        }
    </script>
</body>
</html>
