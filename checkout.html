<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINDIE - Checkout & Status System</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --dark-brown: #3d2b1f; --soft-cream: #fdfaf5; --gold-accent: #b5894b; 
            --nature-green: #465c47; --white: #ffffff; --danger: #e74c3c;
            --shadow: 0 10px 30px rgba(61, 43, 31, 0.08);
        }

        body { margin: 0; font-family: 'Mitr', sans-serif; background: var(--soft-cream); color: var(--dark-brown); min-height: 100vh; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: var(--white); box-shadow: 0 2px 15px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 1000; }
        .logo-img { height: 40px; width: 40px; border-radius: 50%; object-fit: cover; }
        .container { padding: 20px 5%; max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 30px; align-items: start; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

        .card { background: var(--white); padding: 30px; border-radius: 25px; box-shadow: var(--shadow); border: 1px solid rgba(181, 137, 75, 0.1); margin-bottom: 20px; }
        h2 { font-family: 'Playfair Display', serif; color: var(--nature-green); font-size: 24px; margin-bottom: 25px; border-bottom: 2px solid var(--soft-cream); padding-bottom: 10px; }

        .type-selector { display: flex; gap: 10px; margin-bottom: 25px; }
        .type-btn { flex: 1; padding: 12px; border: 1.5px solid #eee; border-radius: 12px; background: #fff; cursor: pointer; transition: 0.3s; font-family: 'Mitr'; font-size: 15px; }
        .type-btn.active { background: var(--dark-brown); color: var(--white); border-color: var(--dark-brown); }

        .input-group { margin-bottom: 20px; }
        input, textarea, select { width: 100%; padding: 15px; border: 1.5px solid #f0f0f0; border-radius: 12px; box-sizing: border-box; font-family: 'Mitr'; background: #fafafa; font-size: 14px; outline: none; }

        .zone-title { font-size: 13px; font-weight: 500; color: var(--gold-accent); margin: 15px 0 10px; display: block; }
        .table-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 8px; }
        .table-btn { padding: 10px 5px; border: 1px solid #eee; border-radius: 10px; background: #fff; cursor: pointer; font-size: 12px; transition: 0.2s; font-family: 'Mitr'; }
        .table-btn.selected { background: var(--gold-accent); color: white; border-color: var(--gold-accent); }

        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px dashed #eee; }
        .edit-pill { background: var(--danger); color: white; padding: 6px 20px; border-radius: 25px; font-size: 11px; border: none; cursor: pointer; transition: 0.3s; }
        .total-row { display: flex; justify-content: space-between; padding-top: 20px; font-size: 22px; font-weight: 700; color: var(--gold-accent); }
        
        .action-buttons { display: flex; flex-direction: column; gap: 12px; margin-top: 25px; }
        .btn-main { background: var(--dark-brown); color: white; border: none; padding: 18px; border-radius: 18px; width: 100%; cursor: pointer; font-family: 'Mitr'; font-size: 17px; font-weight: 500; box-sizing: border-box; }
        .btn-secondary { background: var(--gold-accent); color: white; border: none; padding: 18px; border-radius: 18px; width: 100%; text-align: center; text-decoration: none; display: block; font-family: 'Mitr'; font-size: 17px; box-sizing: border-box; }

        .history-item { padding: 15px; border-bottom: 1px solid #eee; background: #fafafa; border-radius: 15px; margin-bottom: 10px; font-size: 13px; border-left: 5px solid var(--nature-green); }

        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); align-items: center; justify-content: center; }
        .modal-card { background: white; width: 90%; max-width: 400px; padding: 30px; border-radius: 30px; text-align: center; }
        .qty-control { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 20px 0; }
        .qty-btn { width: 40px; height: 40px; border: 2px solid var(--gold-accent); border-radius: 50%; background: none; color: var(--gold-accent); font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <header>
        <div style="display:flex; align-items:center; gap:10px;">
            <img src="image/a1.jpg" class="logo-img">
            <span class="brand-name" style="font-family:'Playfair Display'; font-weight:700; font-size: 22px;">KINDIE</span>
        </div>
       <nav class="nav-links">
            <a href="menu.html" style="text-decoration:none; color:var(--dark-brown); font-size: 14px;">หน้าเมนู</a>
        </nav>
    </header>

    <div class="container">
        <div class="left-col">
            <div class="card">
                <h2>Customer Info</h2>
                <div class="type-selector">
                    <button class="type-btn active" id="btnDineIn" onclick="setMode('dine-in')">ทานที่ร้าน</button>
                    <button class="type-btn" id="btnTakeAway" onclick="setMode('take-away')">กลับบ้าน</button>
                </div>

                <div id="dineInFields">
                    <span class="zone-title">📍 โซนในร้าน (A01 - A09)</span>
                    <div id="gridA" class="table-grid"></div>
                    <span class="zone-title">🌳 โซนนอกร้าน (B01 - B12)</span>
                    <div id="gridB" class="table-grid"></div>
                </div>

                <div id="takeAwayFields" style="display:none;">
                    <div class="input-group"><input type="text" id="taName" placeholder="ชื่อผู้สั่ง"></div>
                    <div class="input-group"><input type="tel" id="taPhone" placeholder="เบอร์โทรศัพท์ (10 หลัก)" oninput="handlePhoneHistory()"></div>
                    <div class="input-group"><textarea id="taAddress" rows="3" placeholder="ระบุที่อยู่จัดส่ง หรือ 'รับหน้าร้าน'"></textarea></div>
                </div>
            </div>

            <div class="card" id="historyCard" style="display:none;">
                <h2 id="historyTitle" style="font-size: 18px; margin-bottom: 15px;">🕒 ประวัติและสถานะล่าสุด</h2>
                <div id="historyItems"></div>
            </div>
        </div>

        <div class="right-col">
            <div class="card">
                <h2>Current Order</h2>
                <div id="cartItems"></div>
                <div class="total-row"><span>ยอดรวม</span><span id="grandTotal">฿0</span></div>
                
                <div class="action-buttons">
                    <button id="mainConfirmBtn" class="btn-main" onclick="handleOrder()">ยืนยันออเดอร์</button>
                    <a href="menu.html" class="btn-secondary">สั่งเมนูเพิ่ม +</a>
                </div>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-card">
            <h3 id="editTitle" style="margin-top:0;">ชื่ออาหาร</h3>
            <div class="qty-control">
                <button class="qty-btn" onclick="changeQty(-1)">-</button>
                <span id="editQty" style="font-size:22px; font-weight:600;">1</span>
                <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
            <div style="text-align: left; margin-top: 15px;">
                <label style="font-size: 13px;">ประเภทเนื้อสัตว์</label>
                <select id="editMeat">
                    <option value="หมู">หมู</option><option value="ไก่">ไก่</option><option value="ทะเล">ทะเล</option><option value="เนื้อ">เนื้อ</option>
                </select>
            </div>
            <div style="text-align: left; margin-top: 15px;">
                <label style="font-size: 13px;">หมายเหตุเพิ่มเติม</label>
                <input type="text" id="editNote" placeholder="เช่น ไม่เผ็ด, หวานน้อย...">
            </div>
            <div style="margin-top:20px; font-size:20px; font-weight:700; color:var(--gold-accent);">ยอดรวม: <span id="editSubtotal">฿0</span></div>
            <button class="btn-main" style="margin-top:20px;" onclick="saveEdit()">ยืนยันการแก้ไข</button>
            <button onclick="closeModal()" style="background:none; border:none; color:#bbb; margin-top:10px; cursor:pointer;">ยกเลิก</button>
        </div>
    </div>

    <script>
        let currentMode = 'dine-in'; let selectedTable = null; let editingIdx = null;
        const dineInFlow = ["รอครัวรับออเดอร์", "กำลังปรุงอาหาร", "พร้อมเสิร์ฟ", "เสิร์ฟเรียบร้อย"];
        const taFlow = ["ร้านรับออเดอร์แล้ว", "กำลังปรุงอาหาร (10-15 นาที)", "ปรุงเสร็จแล้ว", "กำลังไปส่ง", "ส่งสินค้าเรียบร้อย"];

        window.onload = () => { renderTables(); loadCart(); checkAutoTable(); checkPaymentFinish(); setInterval(autoUpdateStatus, 12000); };

        function renderTables() {
            const gridA = document.getElementById('gridA'); const gridB = document.getElementById('gridB');
            gridA.innerHTML = ''; gridB.innerHTML = '';
            for(let i=1; i<=9; i++) { let id = `A0${i}`; gridA.innerHTML += `<button class="table-btn" id="btn${id}" onclick="selectTable('${id}')">${id}</button>`; }
            for(let i=1; i<=12; i++) { let id = `B${i < 10 ? '0'+i : i}`; gridB.innerHTML += `<button class="table-btn" id="btn${id}" onclick="selectTable('${id}')">${id}</button>`; }
        }

        function selectTable(id) {
            selectedTable = id;
            document.querySelectorAll('.table-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById(`btn${id}`).classList.add('selected');
            localStorage.setItem('lastTableInfo', JSON.stringify({id, time: new Date().getTime()}));
            showHistory('dine-in', id);
        }

        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btnDineIn').classList.toggle('active', mode === 'dine-in');
            document.getElementById('btnTakeAway').classList.toggle('active', mode === 'take-away');
            document.getElementById('dineInFields').style.display = mode === 'dine-in' ? 'block' : 'none';
            document.getElementById('takeAwayFields').style.display = mode === 'take-away' ? 'block' : 'none';
            document.getElementById('mainConfirmBtn').innerText = mode === 'dine-in' ? 'ยืนยันออเดอร์' : 'ชำระเงิน';
            document.getElementById('historyCard').style.display = 'none';
        }

        function handlePhoneHistory() {
            const phone = document.getElementById('taPhone').value;
            if(phone.length === 10) showHistory('take-away', phone);
        }

        function showHistory(type, key) {
            const historyData = JSON.parse(localStorage.getItem('kindieHistory')) || [];
            const now = new Date().getTime();
            const filtered = historyData.filter(h => h.type !== 'dine-in' || (now - h.timestamp < 2 * 60 * 60 * 1000));
            const myHistory = filtered.filter(h => h.key === key && h.type === type);
            if(myHistory.length > 0) {
                document.getElementById('historyCard').style.display = 'block';
                document.getElementById('historyItems').innerHTML = myHistory.reverse().map(h => {
                    const flow = h.type === 'dine-in' ? dineInFlow : taFlow;
                    return `<div class="history-item"><span style="color:var(--nature-green); font-weight:bold; float:right;">${flow[h.stIndex || 0]}</span><b>${h.type === 'dine-in' ? 'โต๊ะ '+h.key : 'กลับบ้าน'}</b><br><small>${h.items}</small><br><b>${h.total}</b></div>`;
                }).join('');
            }
        }

        function autoUpdateStatus() {
            let history = JSON.parse(localStorage.getItem('kindieHistory')) || [];
            let changed = false;
            history.forEach(h => {
                const flow = h.type === 'dine-in' ? dineInFlow : taFlow;
                if((h.stIndex || 0) < flow.length - 1) { h.stIndex = (h.stIndex || 0) + 1; changed = true; }
            });
            if(changed) {
                localStorage.setItem('kindieHistory', JSON.stringify(history));
                if(currentMode === 'dine-in' && selectedTable) showHistory('dine-in', selectedTable);
            }
        }

        function loadCart() {
            const cart = JSON.parse(localStorage.getItem('kindieCart')) || [];
            const container = document.getElementById('cartItems'); let total = 0;
            if (cart.length === 0) { container.innerHTML = `<p style="color:#aaa; text-align:center;">ไม่มีรายการในตะกร้า</p>`; document.getElementById('grandTotal').innerText = "฿0"; return; }
            container.innerHTML = cart.map((i, idx) => {
                total += i.total;
                return `<div class="item-row"><div style="font-size:14px;"><b>${i.name}</b><br><small>฿${i.total.toLocaleString()}</small></div><button class="edit-pill" onclick="openEdit(${idx})">แก้ไข</button></div>`;
            }).join('');
            document.getElementById('grandTotal').innerText = "฿" + total.toLocaleString();
        }

        function handleOrder() {
            const cart = JSON.parse(localStorage.getItem('kindieCart')) || [];
            if(cart.length === 0) return;
            const totalText = document.getElementById('grandTotal').innerText;
            const totalVal = totalText.replace(/[฿,]/g, '');

            if(currentMode === 'dine-in') {
                if(!selectedTable) { alert("กรุณาเลือกโต๊ะค่ะ"); return; }
                saveToHistory('dine-in', selectedTable, cart, totalText);
                alert("ส่งเมนูไปยังครัวเรียบร้อยแล้วค่ะ"); localStorage.removeItem('kindieCart'); location.reload();
            } else {
                const phone = document.getElementById('taPhone').value;
                if(phone.length < 10) { alert("กรุณากรอกเบอร์โทรค่ะ"); return; }
                saveToHistory('take-away', phone, cart, totalText);
                localStorage.setItem('lastTAPhone', phone);
                localStorage.removeItem('kindieCart'); 
                window.location.href = `payment_page.html?amt=${totalVal}`;
            }
        }

        function saveToHistory(type, key, cart, total) {
            let history = JSON.parse(localStorage.getItem('kindieHistory')) || [];
            history.push({ type, key, items: cart.map(i => i.name).join(', '), total, stIndex: 0, time: new Date().toLocaleTimeString(), timestamp: new Date().getTime() });
            localStorage.setItem('kindieHistory', JSON.stringify(history));
        }

        function openEdit(idx) { editingIdx = idx; const cart = JSON.parse(localStorage.getItem('kindieCart')); const item = cart[idx]; document.getElementById('editTitle').innerText = item.name.split(' (')[0]; document.getElementById('editQty').innerText = item.qty || 1; document.getElementById('editSubtotal').innerText = "฿" + item.total.toLocaleString(); document.getElementById('editModal').style.display = 'flex'; }
        function changeQty(val) { let q = Math.max(1, parseInt(document.getElementById('editQty').innerText) + val); document.getElementById('editQty').innerText = q; const cart = JSON.parse(localStorage.getItem('kindieCart')); const unitPrice = cart[editingIdx].total / (cart[editingIdx].qty || 1); document.getElementById('editSubtotal').innerText = "฿" + (q * unitPrice).toLocaleString(); }
        function saveEdit() { let cart = JSON.parse(localStorage.getItem('kindieCart')); const q = parseInt(document.getElementById('editQty').innerText); const meat = document.getElementById('editMeat').value; const unitPrice = cart[editingIdx].total / (cart[editingIdx].qty || 1); cart[editingIdx].name = cart[editingIdx].name.split(' (')[0] + ` (${meat})`; cart[editingIdx].qty = q; cart[editingIdx].total = q * unitPrice; localStorage.setItem('kindieCart', JSON.stringify(cart)); loadCart(); closeModal(); }
        function closeModal() { document.getElementById('editModal').style.display = 'none'; }
        function checkAutoTable() { const last = JSON.parse(localStorage.getItem('lastTableInfo')); if(last && (new Date().getTime() - last.time < 3 * 60 * 60 * 1000)) selectTable(last.id); }
        function checkPaymentFinish() { if (localStorage.getItem('paymentDone') === 'true') { localStorage.removeItem('paymentDone'); window.location.href = "order_history.html"; } }
    </script>
</body>
</html>
