<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINDIE - Checkout & Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --dark-brown: #3d2b1f; --soft-cream: #fdfaf5; --gold-accent: #b5894b; 
            --nature-green: #465c47; --white: #ffffff; --danger: #e74c3c;
            --shadow: 0 10px 40px rgba(61, 43, 31, 0.06);
        }

        body { margin: 0; font-family: 'Mitr', sans-serif; background: var(--soft-cream); color: var(--dark-brown); min-height: 100vh; overflow-x: hidden; }
        
        header { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 15px 8%; background: var(--white); position: sticky; 
            top: 0; z-index: 1000; box-shadow: 0 4px 25px rgba(0,0,0,0.04); 
        }

        .brand-container { display: flex; align-items: center; gap: 12px; }
        .logo-img { height: 45px; width: 45px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold-accent); padding: 2px; }
        .shop-name { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; margin: 0; }

        .nav-links { display: flex; gap: 20px; }
        .nav-links a { text-decoration: none; color: var(--dark-brown); font-size: 14px; }

        .container { padding: 30px 5%; max-width: 1400px; margin: 0 auto; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 30px; align-items: start; }

        .card { background: var(--white); padding: 30px; border-radius: 25px; box-shadow: var(--shadow); border: 1px solid rgba(181, 137, 75, 0.1); margin-bottom: 20px; }
        h2 { font-family: 'Playfair Display', serif; color: var(--nature-green); font-size: 24px; margin-bottom: 20px; border-bottom: 2px solid var(--soft-cream); padding-bottom: 10px; }

        .zone-container { background: #fafafa; padding: 15px; border-radius: 20px; margin-bottom: 15px; border: 1px solid #f0f0f0; }
        .zone-title { font-size: 14px; font-weight: 600; color: var(--gold-accent); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        
        .t-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr)); gap: 10px; }
        .t-btn { padding: 12px 5px; border: 1px solid #eee; border-radius: 12px; background: #fff; cursor: pointer; font-size: 12px; font-family: 'Mitr'; transition: 0.2s; position: relative; }
        .t-btn.selected { background: var(--gold-accent); color: white; border-color: var(--gold-accent); }
        .t-btn.occupied { background: #fee2e2; color: #ef4444; cursor: not-allowed; border-color: #fecaca; }

        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px dashed #eee; }
        .edit-pill { background: var(--danger); color: white; padding: 6px 18px; border-radius: 25px; font-size: 11px; border: none; cursor: pointer; transition: 0.3s; font-family: 'Mitr'; }
        .edit-pill:hover { opacity: 0.8; }

        .total-row { display: flex; justify-content: space-between; padding-top: 20px; font-size: 24px; font-weight: 700; color: var(--gold-accent); }
        
        .action-btns { display: flex; flex-direction: column; gap: 12px; margin-top: 25px; }
        .btn-p { background: var(--dark-brown); color: white; border: none; padding: 18px; border-radius: 18px; cursor: pointer; font-family: 'Mitr'; font-size: 17px; font-weight: 500; transition: 0.3s; }
        .btn-s { background: var(--gold-accent); color: white; text-decoration: none; padding: 18px; border-radius: 18px; text-align: center; font-size: 17px; display: block; box-sizing: border-box; transition: 0.3s; }

        .h-item { padding: 15px; background: #fafafa; border-radius: 18px; margin-bottom: 12px; font-size: 13px; border-left: 5px solid var(--nature-green); }

        /* Modal แก้ไขรายการ */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--white); padding: 30px; border-radius: 30px; width: 100%; max-width: 400px; text-align: center; position: relative; }
        .close-btn { position: absolute; right: 20px; top: 15px; font-size: 28px; color: #ccc; cursor: pointer; }
        
        .qty-control { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 15px 0; }
        .qty-btn { width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--gold-accent); background: white; color: var(--gold-accent); font-size: 20px; cursor: pointer; }
        .btn-save { background: var(--dark-brown); color: var(--white); border: none; padding: 15px; border-radius: 15px; width: 100%; font-size: 1rem; cursor: pointer; margin-top: 20px; }

        @media (max-width: 900px) {
            header { padding: 15px 5%; flex-direction: column; gap: 15px; }
            .container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand-container">
            <img src="image/a1.jpg" class="logo-img">
            <span class="shop-name">KINDIE</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">หน้าหลัก</a>
            <a href="menu.html">เมนูอาหาร</a>
            <a href="reservation.html">จองโต๊ะ</a>
            <a href="checkout.html" style="color: var(--gold-accent);">คำสั่งซื้อ</a>
        </nav>
    </header>

    <div class="container">
        <div class="left">
            <div class="card">
                <h2>Table Selection</h2>
                <div class="zone-container">
                    <span class="zone-title">📍 โซนในร้าน (Indoor Zone A)</span>
                    <div id="gridA" class="t-grid"></div>
                </div>
                <div class="zone-container">
                    <span class="zone-title">🌳 โซนนอกร้าน (Outdoor Zone B)</span>
                    <div id="gridB" class="t-grid"></div>
                </div>
            </div>
            <div class="card" id="hCard" style="display:none;">
                <h2 style="font-size: 18px;">🕒 สถานะการเสิร์ฟอาหาร</h2>
                <div id="hList"></div>
                <p style="text-align:center; color:#888; font-size:11px; margin-top:15px;">*กรุณาแจ้งเลขโต๊ะที่เคาน์เตอร์เพื่อชำระเงินและคืนโต๊ะ</p>
            </div>
        </div>

        <div class="right">
            <div class="card">
                <h2>Current Order</h2>
                <div id="cartItems"></div>
                <div class="total-row"><span>ยอดรวม</span><span id="gTotal">฿0</span></div>
                <div class="action-btns">
                    <button class="btn-p" onclick="sendO()">ส่งออเดอร์เข้าครัว</button>
                    <a href="menu.html" class="btn-s">สั่งอาหารเพิ่ม +</a>
                </div>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeEditModal()">&times;</span>
            <h2 id="editTitle">แก้ไขเมนู</h2>
            <div class="qty-control">
                <button class="qty-btn" onclick="updateEditQty(-1)">-</button>
                <span id="editQtyDisplay" style="font-size: 24px; font-weight: 600;">1</span>
                <button class="qty-btn" onclick="updateEditQty(1)">+</button>
            </div>
            
            <div id="editOptionsArea" style="text-align:left;">
                <label style="font-size:0.9rem; color:var(--gold-accent);">ระบุเนื้อสัตว์/เพิ่มเติม</label>
                <input type="text" id="editNote" style="width:100%; padding:12px; border-radius:12px; border:1.5px solid #eee; margin-top:5px; font-family:'Mitr';" placeholder="เช่น หมู, ทะเล, ไม่เผ็ด...">
            </div>

            <button class="btn-save" onclick="saveEdit()">ยืนยันการแก้ไข</button>
            <button onclick="removeItem()" style="background:none; border:none; color:var(--danger); margin-top:15px; cursor:pointer; font-family:'Mitr'; font-size:13px;">ลบรายการนี้ออก</button>
        </div>
    </div>

    <script>
        let selT = null; 
        let editingIndex = null;
        const flow = ["รอครัวรับออเดอร์", "กำลังปรุงอาหาร", "พร้อมเสิร์ฟ", "เสิร์ฟเรียบร้อย"];
        
        window.onload = () => { 
            render(); loadC(); checkT(); 
            setInterval(autoUpdateStatus, 10000); 
            setInterval(cleanupOldOrders, 60000); 
        };

        function render() {
            const gridA = document.getElementById('gridA');
            const gridB = document.getElementById('gridB');
            gridA.innerHTML = ''; gridB.innerHTML = '';
            const booked = JSON.parse(localStorage.getItem('kindieReservations')) || [];
            for(let i=1; i<=21; i++) {
                const id = i <= 9 ? `A-${i.toString().padStart(2,'0')}` : `B-${(i-9).toString().padStart(2,'0')}`;
                const isOcc = booked.some(b => b.table === id && b.status === 'จองสำเร็จ');
                const btnHtml = `<button class="t-btn ${isOcc ? 'occupied' : ''}" id="btn${id}" onclick="sel('${id}')">${id}</button>`;
                if(i <= 9) gridA.innerHTML += btnHtml; else gridB.innerHTML += btnHtml;
            }
        }

        function sel(id) {
            const btn = document.getElementById('btn'+id);
            if(btn.classList.contains('occupied')) { alert("โต๊ะนี้มีการจองไว้แล้วค่ะ"); return; }
            selT = id; 
            document.querySelectorAll('.t-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            localStorage.setItem('lastTableInfo', JSON.stringify({id, time: new Date().getTime()})); 
            showH(id);
        }

        function loadC() {
            const cart = JSON.parse(localStorage.getItem('kindieCart')) || [];
            const container = document.getElementById('cartItems'); let t = 0;
            if (cart.length === 0) { 
                container.innerHTML = `<p style="color:#aaa; text-align:center; padding: 20px;">ไม่มีรายการอาหารที่กำลังสั่ง</p>`; 
                document.getElementById('gTotal').innerText = "฿0"; return; 
            }
            container.innerHTML = cart.map((i, idx) => { 
                t += i.total; 
                return `<div class="item-row">
                    <div><b>${i.name}</b><br><small style="color:var(--gold-accent);">฿${i.total.toLocaleString()}</small></div>
                    <button class="edit-pill" onclick="openEditModal(${idx})">แก้ไข</button>
                </div>`; 
            }).join('');
            document.getElementById('gTotal').innerText = "฿" + t.toLocaleString();
        }

        /* ฟังก์ชันจัดการ Modal แก้ไขอัจฉริยะ */
        function openEditModal(index) {
            editingIndex = index;
            const cart = JSON.parse(localStorage.getItem('kindieCart'));
            const item = cart[index];
            const nameOnly = item.name.split(' (')[0].split(' [')[0];
            
            document.getElementById('editTitle').innerText = nameOnly;
            document.getElementById('editQtyDisplay').innerText = item.qty || 1;
            
            // เช็คว่าเป็นเมนูข้าวหรือไม่ (อ้างอิงจากชื่อเมนู)
            const isRice = ["ข้าวเปล่า", "ข้าวไรซ์เบอร์รี่", "ข้าวกล้อง"].includes(nameOnly);
            
            // ซ่อน/แสดงส่วนหมายเหตุตามประเภท
            const optionsArea = document.getElementById('editOptionsArea');
            if (isRice) {
                optionsArea.style.display = 'none';
            } else {
                optionsArea.style.display = 'block';
                document.getElementById('editNote').value = item.name.includes('(') ? item.name.split('(')[1].split(')')[0] : "";
            }

            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }

        function updateEditQty(val) {
            let qty = parseInt(document.getElementById('editQtyDisplay').innerText);
            qty = Math.max(1, qty + val);
            document.getElementById('editQtyDisplay').innerText = qty;
        }

        function saveEdit() {
            let cart = JSON.parse(localStorage.getItem('kindieCart'));
            const qty = parseInt(document.getElementById('editQtyDisplay').innerText);
            const nameOnly = document.getElementById('editTitle').innerText;
            const isRice = ["ข้าวเปล่า", "ข้าวไรซ์เบอร์รี่", "ข้าวกล้อง"].includes(nameOnly);
            
            const unitPrice = cart[editingIndex].total / (cart[editingIndex].qty || 1);
            cart[editingIndex].qty = qty;
            cart[editingIndex].total = qty * unitPrice;
            
            if (isRice) {
                cart[editingIndex].name = nameOnly;
            } else {
                const note = document.getElementById('editNote').value.trim();
                cart[editingIndex].name = nameOnly + (note ? ` (${note})` : "");
            }
            
            localStorage.setItem('kindieCart', JSON.stringify(cart));
            loadC(); closeEditModal();
        }

        function removeItem() {
            if(confirm("ต้องการลบเมนูนี้ออกใช่หรือไม่?")) {
                let cart = JSON.parse(localStorage.getItem('kindieCart'));
                cart.splice(editingIndex, 1);
                localStorage.setItem('kindieCart', JSON.stringify(cart));
                loadC(); closeEditModal();
            }
        }

        function sendO() {
            const cart = JSON.parse(localStorage.getItem('kindieCart')) || [];
            if(!selT || cart.length === 0) { alert("กรุณาเลือกโต๊ะและอาหารก่อนค่ะ"); return; }
            let h = JSON.parse(localStorage.getItem('kindieHistory')) || [];
            h.push({ key: selT, items: cart.map(i=>i.name).join(', '), total: document.getElementById('gTotal').innerText, stIdx: 0, time: new Date().toLocaleTimeString(), ts: new Date().getTime() });
            localStorage.setItem('kindieHistory', JSON.stringify(h)); 
            localStorage.removeItem('kindieCart');
            alert("ส่งออเดอร์แล้ว! กรุณารอสักครู่นะคะ"); 
            loadC(); showH(selT);
        }

        function showH(id) {
            const hData = JSON.parse(localStorage.getItem('kindieHistory')) || [];
            const my = hData.filter(h => h.key === id);
            if(my.length > 0) {
                document.getElementById('hCard').style.display='block';
                document.getElementById('hList').innerHTML = my.reverse().map(m => `
                    <div class="h-item">
                        <span style="color:var(--nature-green); font-weight:bold; float:right;">${flow[m.stIdx || 0]}</span>
                        <b>เวลา:</b> ${m.time} | <b>รวม:</b> ${m.total}<br>
                        <small>${m.items}</small>
                    </div>`).join('');
            } else { document.getElementById('hCard').style.display='none'; }
        }

        function autoUpdateStatus() {
            let h = JSON.parse(localStorage.getItem('kindieHistory')) || [];
            let chg = false;
            h.forEach(m => { if((m.stIdx || 0) < 3) { m.stIdx++; chg = true; } });
            if(chg) { localStorage.setItem('kindieHistory', JSON.stringify(h)); if(selT) showH(selT); }
        }

        function cleanupOldOrders() {
            const now = new Date().getTime();
            let hData = JSON.parse(localStorage.getItem('kindieHistory')) || [];
            const filtered = hData.filter(h => (now - h.ts < 900000));
            if (filtered.length !== hData.length) {
                localStorage.setItem('kindieHistory', JSON.stringify(filtered));
                if(selT) showH(selT);
            }
        }

        function checkT() { 
            const last = JSON.parse(localStorage.getItem('lastTableInfo')); 
            if(last && (new Date().getTime() - last.time < 3600000)) sel(last.id); 
        }
    </script>
</body>
</html>
