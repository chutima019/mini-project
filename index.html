<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINDIE - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --dark-brown: #3d2b1f; 
            --soft-cream: #fdfaf5; 
            --gold-accent: #b5894b;
            --white: #ffffff;
        }
        
        body { 
            margin: 0; 
            font-family: 'Mitr', sans-serif; 
            background: var(--soft-cream); 
            color: var(--dark-brown);
            -webkit-font-smoothing: antialiased;
        }

        /* Header & Navigation */
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 8%; 
            background: rgba(255, 255, 255, 0.95); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); 
            backdrop-filter: blur(10px);
        }

        .brand-container { display: flex; align-items: center; gap: 15px; }
        .logo-img { 
            height: 55px; 
            width: 55px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 2px solid var(--gold-accent);
            box-shadow: 0 4px 10px rgba(181, 137, 75, 0.2);
        }
        .shop-name { 
            font-family: 'Playfair Display', serif; 
            font-size: 28px; 
            font-weight: 700; 
            letter-spacing: 1px;
        }

        .nav-links { display: flex; align-items: center; }
        .nav-links a { 
            text-decoration: none; 
            color: var(--dark-brown); 
            margin-left: 25px; 
            font-size: 15px;
            font-weight: 400;
            transition: all 0.3s ease;
            position: relative;
        }
        .nav-links a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -5px;
            left: 0;
            background-color: var(--gold-accent);
            transition: width 0.3s;
        }
        .nav-links a:hover { color: var(--gold-accent); }
        .nav-links a:hover::after { width: 100%; }

        /* Hero Banner */
        .hero-banner { padding: 40px 8%; }
        .banner-box { 
            width: 100%; 
            height: 500px; 
            border-radius: 30px; 
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.1)), 
                        url('https://images.unsplash.com/photo-1544145945-f904253db0ad?q=80&w=2000') center/cover; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .banner-content h1 { 
            font-family: 'Playfair Display', serif; 
            font-size: 5rem; 
            color: var(--white); 
            margin: 0;
            font-style: italic;
            text-shadow: 2px 4px 10px rgba(0,0,0,0.3);
            letter-spacing: 4px;
        }

        /* Featured Section */
        .featured-section { padding: 60px 8%; text-align: center; }
        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            margin-bottom: 50px;
            position: relative;
            display: inline-block;
        }
        .section-title::after {
            content: "";
            display: block;
            width: 40px;
            height: 3px;
            background: var(--gold-accent);
            margin: 10px auto;
        }

        .menu-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 40px; 
            max-width: 1100px; 
            margin: 0 auto; 
        }

        .menu-item { 
            background: var(--white); 
            border-radius: 25px; 
            overflow: hidden; 
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            border: 1px solid rgba(0,0,0,0.02);
            position: relative;
        }
        .menu-item:hover { 
            transform: translateY(-12px); 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
        }

        .menu-img-container {
            width: 100%;
            height: 300px;
            overflow: hidden;
        }
        .menu-img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            transition: transform 0.6s;
        }
        .menu-item:hover .menu-img { transform: scale(1.1); }

        .menu-detail { 
            padding: 25px; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-name {
            font-size: 18px;
            font-weight: 500;
            text-align: left;
        }
        .menu-price { 
            color: var(--gold-accent); 
            font-weight: 600; 
            font-size: 20px;
            background: rgba(181, 137, 75, 0.1);
            padding: 5px 15px;
            border-radius: 12px;
        }

        /* Responsive */
        @media (max-width: 850px) {
            .menu-grid { grid-template-columns: 1fr; }
            .banner-content h1 { font-size: 3.5rem; }
            header { padding: 15px 5%; }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand-container">
            <img src="image/a1.jpg" alt="KINDIE Logo" class="logo-img">
            <span class="shop-name">KINDIE</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">หน้าหลัก</a>
            <a href="menu.html">เมนูอาหาร</a>
            <a href="reservation.html">จองโต๊ะ</a>
            <a href="checkout.html">ชำระเงิน</a>
        </nav>
    </header>

    <main>
        <section class="hero-banner">
            <div class="banner-box">
                <div class="banner-content">
                    <h1>KINDIE</h1>
                </div>
            </div>
        </section>

        <section class="featured-section">
            <h2 class="section-title">Signature Menu</h2>
            <div class="menu-grid">
                <div class="menu-item" onclick="location.href='menu.html'">
                    <div class="menu-img-container">
                        <img src="https://images.unsplash.com/photo-1544025162-d76694265947?w=800" alt="Ribeye Steak" class="menu-img">
                    </div>
                    <div class="menu-detail">
                        <div class="menu-name">สเต็กเนื้อริบอายย่างซอสไวน์แดง</div>
                        <div class="menu-price">฿380</div>
                    </div>
                </div>
                <div class="menu-item" onclick="location.href='menu.html'">
                    <div class="menu-img-container">
                        <img src="https://images.unsplash.com/photo-1586816001966-79b736744398?w=800" alt="Wagyu Burger" class="menu-img">
                    </div>
                    <div class="menu-detail">
                        <div class="menu-name">ชุดเบอร์เกอร์เนื้อวากิว</div>
                        <div class="menu-price">฿320</div>
                    </div>
                </div>
                <div class="menu-item" onclick="location.href='menu.html'">
                    <div class="menu-img-container">
                        <img src="https://images.unsplash.com/photo-1551024506-0bccd828d307?w=800" alt="Honey Toast" class="menu-img">
                    </div>
                    <div class="menu-detail">
                        <div class="menu-name">โทสต์น้ำผึ้งผลไม้รวม</div>
                        <div class="menu-price">฿220</div>
                    </div>
                </div>
                <div class="menu-item" onclick="location.href='menu.html'">
                    <div class="menu-img-container">
                        <img src="https://images.unsplash.com/photo-1515823064-d6e0c04616a7?w=800" alt="Matcha Green Tea" class="menu-img">
                    </div>
                    <div class="menu-detail">
                        <div class="menu-name">มัทฉะกรีนที</div>
                        <div class="menu-price">฿85</div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
