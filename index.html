<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINDIE - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root { --dark-brown: #3d2b1f; --soft-cream: #fdfaf5; --gold-accent: #b5894b; --white: #ffffff; }
        body { margin: 0; font-family: 'Mitr', sans-serif; background: var(--soft-cream); color: var(--dark-brown); }
        
        /* แก้ไขส่วน Header ให้ตรงกัน */
        header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px 8%; 
            background: var(--white); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.03); 
        }

        /* จัดระเบียบ Brand Container */
        .brand-container { 
            display: flex; 
            align-items: center; 
            gap: 15px; /* ระยะห่างระหว่างรูปกับชื่อ */
        }

        .logo-img { 
            height: 60px; 
            width: 60px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 2px solid var(--gold-accent);
            display: block;
        }

        .shop-name { 
            font-family: 'Playfair Display', serif; 
            font-size: 28px; 
            font-weight: 700; 
            line-height: 1; /* ดึงให้ตัวอักษรอยู่กลางระนาบเดียวกับรูป */
            margin: 0;
        }

        .nav-links a { text-decoration: none; color: var(--dark-brown); margin-left: 25px; font-size: 15px; transition: 0.3s; }
        .nav-links a:hover { color: var(--gold-accent); }

        .hero-banner { padding: 40px 8%; }
        .banner-box { width: 100%; height: 450px; border-radius: 30px; background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.1)), url('https://images.unsplash.com/photo-1544145945-f904253db0ad?q=80&w=2000') center/cover; display: flex; align-items: center; justify-content: center; border: 10px solid #fff; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .banner-content h1 { font-family: 'Playfair Display', serif; font-size: 4rem; color: #fff; margin: 0; font-style: italic; }

        .featured-section { padding: 60px 8%; text-align: center; }
        .section-title { font-family: 'Playfair Display', serif; font-size: 32px; margin-bottom: 50px; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 40px; max-width: 1100px; margin: 0 auto; }
        .menu-item { background: var(--white); border-radius: 25px; overflow: hidden; cursor: pointer; transition: 0.4s; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .menu-item:hover { transform: translateY(-12px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .menu-img { width: 100%; height: 300px; object-fit: cover; }
        .menu-detail { padding: 25px; display: flex; justify-content: space-between; align-items: center; }
        .menu-price { color: var(--gold-accent); font-weight: 600; font-size: 20px; background: rgba(181, 137, 75, 0.1); padding: 5px 15px; border-radius: 12px; }
        
        @media (max-width: 768px) {
            .menu-grid { grid-template-columns: 1fr; }
            header { padding: 15px 5%; }
            .banner-content h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
    <header>
        <div class="brand-container">
            <img src="image/a1.jpg" class="logo-img">
            <span class="shop-name">KINDIE</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">หน้าหลัก</a>
            <a href="menu.html">เมนูอาหาร</a>
            <a href="reservation.html">จองโต๊ะ</a>
            <a href="checkout.html">ชำระเงิน</a>
        </nav>
    </header>

    <main>
        <section class="hero-banner">
            <div class="banner-box">
                <div class="banner-content"><h1>KINDIE</h1></div>
            </div>
        </section>
        
        <section class="featured-section">
            <h2 class="section-title">Signature Menu</h2>
            <div class="menu-grid">
                <div class="menu-item" onclick="location.href='menu.html'">
                    <img src="image/b1.jpg" class="menu-img">
                    <div class="menu-detail"><div>กุ้งอบวุ่นเส้น</div><div class="menu-price">฿180</div></div>
                </div>
                <div class="menu-item" onclick="location.href='menu.html'">
                    <img src="image/Gemini_Generated_Image_jhltinjhltinjhlt.png" class="menu-img">
                    <div class="menu-detail"><div>บิงซูเกล็ดหิมะ</div><div class="menu-price">฿250</div></div>
                </div>
                <div class="menu-item" onclick="location.href='menu.html'">
                    <img src="image/t1.jpg" class="menu-img">
                    <div class="menu-detail"><div>ตำถาดซีฟู้ด</div><div class="menu-price">฿380</div></div>
                </div>
                <div class="menu-item" onclick="location.href='menu.html'">
                    <img src="image/m2.jpg" class="menu-img">
                    <div class="menu-detail"><div>มัทฉะกรีนที</div><div class="menu-price">฿70</div></div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
