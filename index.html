<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINDIE - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root { --dark-brown: #3d2b1f; --soft-cream: #fdfaf5; --gold-accent: #b5894b; }
        body { margin: 0; font-family: 'Mitr', sans-serif; background: var(--soft-cream); color: var(--dark-brown); }
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px 8%; background: #fff; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 15px rgba(0,0,0,0.05); }
        .logo-img { height: 60px; width: 60px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold-accent); }
        .shop-name { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; }
        .nav-links a { text-decoration: none; color: var(--dark-brown); margin-left: 20px; font-size: 14px; }
        
        .hero-banner { padding: 30px 8%; }
        .banner-box { width: 100%; height: 450px; border-radius: 20px; background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url('https://images.unsplash.com/photo-1544145945-f904253db0ad?q=80&w=2000') center/cover; display: flex; align-items: center; justify-content: center; border: 10px solid #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .banner-content h1 { font-family: 'Playfair Display', serif; font-size: 3.5rem; color: #fff; margin: 0; }

        .featured-section { padding: 40px 8%; text-align: center; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; max-width: 1000px; margin: 0 auto; }
        .menu-item { background: #fff; border-radius: 15px; overflow: hidden; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 20px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.05); }
        .menu-item:hover { transform: translateY(-5px); }
        .menu-img { width: 100%; height: 280px; object-fit: cover; }
        .menu-detail { padding: 20px; }
        .menu-price { color: var(--gold-accent); font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <div class="brand-container"><img src="logo-kindie.png" class="logo-img"><span class="shop-name">KINDIE</span></div>
        <nav class="nav-links">
            <a href="index.html">หน้าหลัก</a>
            <a href="menu.html">เมนูอาหาร</a>
            <a href="reservation.html">จองโต๊ะ</a></nav>
            <a href="checkout.html">ชำระเงิน</a></nav>
    </header>

    <main>
        <section class="hero-banner"><div class="banner-box"><div class="banner-content"><h1>KINDIE</h1></div></div></section>
        <section class="featured-section">
            <h2 class="section-title">Signature Menu</h2>
            <div class="menu-grid">
                <div class="menu-item" onclick="location.href='menu.html'">
                    <img src="https://images.unsplash.com/photo-1544025162-d76694265947?w=800" class="menu-img">
                    <div class="menu-detail"><div>สเต็กเนื้อริบอายย่างซอสไวน์แดง</div><div class="menu-price">฿380</div></div>
                </div>
                <div class="menu-item" onclick="location.href='menu.html'">
                    <img src="https://images.unsplash.com/photo-1586816001966-79b736744398?w=800" class="menu-img">
                    <div class="menu-detail"><div>ชุดเบอร์เกอร์เนื้อวากิว</div><div class="menu-price">฿320</div></div>
                </div>
                <div class="menu-item" onclick="location.href='menu.html'">
                    <img src="https://images.unsplash.com/photo-1551024506-0bccd828d307?w=800" class="menu-img">
                    <div class="menu-detail"><div>โทสต์น้ำผึ้งผลไม้รวม</div><div class="menu-price">฿220</div></div>
                </div>
                <div class="menu-item" onclick="location.href='menu.html'">
                    <img src="https://images.unsplash.com/photo-1515823064-d6e0c04616a7?w=800" class="menu-img">
                    <div class="menu-detail"><div>มัทฉะกรีนที</div><div class="menu-price">฿85</div></div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
