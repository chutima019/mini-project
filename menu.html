<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINDIE - Full Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --dark-brown: #3d2b1f;
            --soft-cream: #fdfaf5;
            --gold-accent: #b5894b;
            --nature-green: #465c47;
        }

        body {
            margin: 0;
            font-family: 'Mitr', sans-serif;
            background-color: var(--soft-cream);
            color: var(--dark-brown);
        }

        /* --- Header --- */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 8%; background: #fff; position: sticky; top: 0; z-index: 1000;
            box-shadow: 0 2px 15px rgba(0,0,0,0.05);
        }
        .logo-img { height: 60px; width: 60px; border-radius: 50%; object-fit: cover; border: 2px solid var(--gold-accent); }
        .shop-name { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; }
        .nav-links a { text-decoration: none; color: var(--dark-brown); margin-left: 20px; font-size: 14px; }

        /* --- Menu Content --- */
        .menu-container { padding: 40px 8%; max-width: 1100px; margin: 0 auto; }
        .category-title {
            font-family: 'Playfair Display', serif; font-size: 2rem;
            margin: 40px 0 20px; border-left: 5px solid var(--gold-accent);
            padding-left: 15px; color: var(--nature-green);
        }

        .menu-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 25px;
        }

        .menu-card {
            background: #fff; border-radius: 15px; display: flex; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); cursor: pointer; transition: 0.3s;
        }
        .menu-card:hover { transform: scale(1.02); box-shadow: 0 8px 25px rgba(0,0,0,0.1); }
        
        .menu-card img { width: 120px; height: 120px; object-fit: cover; }
        .card-info { padding: 15px; display: flex; flex-direction: column; justify-content: center; }
        .card-info h3 { margin: 0 0 5px; font-size: 16px; }
        .card-info p { margin: 0; color: var(--gold-accent); font-weight: bold; }

        /* --- Modal (ระบบเลือกเมนู) --- */
        .modal {
            display: none; position: fixed; z-index: 2000; left: 0; top: 0;
            width: 100%; height: 100%; background-color: rgba(0,0,0,0.7);
            align-items: center; justify-content: center;
        }
        .modal-content {
            background-color: #fff; padding: 30px; border-radius: 20px;
            width: 90%; max-width: 380px; text-align: center; position: relative;
        }
        .close-btn { position: absolute; right: 20px; top: 15px; font-size: 24px; cursor: pointer; }
        .quantity-control { display: flex; justify-content: center; align-items: center; gap: 20px; margin: 20px 0; }
        .qty-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--gold-accent); background: none; color: var(--gold-accent); cursor: pointer; }
        .confirm-btn { background: var(--dark-brown); color: #fff; border: none; padding: 12px 30px; border-radius: 30px; width: 100%; cursor: pointer; }

        @media (max-width: 768px) { .menu-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <div style="display: flex; align-items: center; gap: 15px;">
            <img src="logo-kindie.png" alt="Logo" class="logo-img">
            <span class="shop-name">KINDIE</span>
        </div>
        <nav class="nav-links">
            <a href="index.html">หน้าหลัก</a>
            <a href="#">เมนู</a>
            <a href="#">จองโต๊ะ</a>
        </nav>
    </header>

    <div class="menu-container">
        <h1 style="text-align: center; font-family: 'Playfair Display';">Our Full Menu</h1>

        <div class="category-title">Main Course</div>
        <div class="menu-grid">
            <div class="menu-card" onclick="openModal('Wagyu Beef Steak', 590)">
                <img src="https://images.unsplash.com/photo-1544025162-d76694265947?w=300" alt="Steak">
                <div class="card-info">
                    <h3>Wagyu Beef Steak</h3>
                    <p>฿590</p>
                </div>
            </div>
            <div class="menu-card" onclick="openModal('Garden Salad', 420)">
                <img src="https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=300" alt="Salad">
                <div class="card-info">
                    <h3>Garden Salad</h3>
                    <p>฿420</p>
                </div>
            </div>
        </div>

        <div class="category-title">Desserts</div>
        <div class="menu-grid">
            <div class="menu-card" onclick="openModal('Chocolate Lava', 280)">
                <img src="https://images.unsplash.com/photo-1551024506-0bccd828d307?w=300" alt="Dessert">
                <div class="card-info">
                    <h3>Chocolate Lava</h3>
                    <p>฿280</p>
                </div>
            </div>
        </div>

        <div class="category-title">Drinks</div>
        <div class="menu-grid">
            <div class="menu-card" onclick="openModal('Forest Berry Tea', 160)">
                <img src="https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=300" alt="Drink">
                <div class="card-info">
                    <h3>Forest Berry Tea</h3>
                    <p>฿160</p>
                </div>
            </div>
        </div>
    </div>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">ชื่อเมนู</h2>
            <div class="quantity-control">
                <button class="qty-btn" onclick="changeQty(-1)">-</button>
                <span id="quantityText" style="font-size: 20px; font-weight: bold;">1</span>
                <button class="qty-btn" onclick="changeQty(1)">+</button>
            </div>
            <p>ราคารวม: <span id="totalPriceText" style="color: var(--gold-accent); font-weight: bold;">฿0</span></p>
            <button class="confirm-btn" onclick="confirmOrder()">เพิ่มลงตะกร้า</button>
        </div>
    </div>

    <script>
        let currentPrice = 0; let currentQty = 1; let currentItemName = "";
        function openModal(name, price) {
            currentItemName = name; currentPrice = price; currentQty = 1;
            document.getElementById('modalTitle').innerText = name;
            updateDisplay();
            document.getElementById('orderModal').style.display = "flex";
        }
        function closeModal() { document.getElementById('orderModal').style.display = "none"; }
        function changeQty(amount) {
            currentQty += amount; if (currentQty < 1) currentQty = 1;
            updateDisplay();
        }
        function updateDisplay() {
            document.getElementById('quantityText').innerText = currentQty;
            document.getElementById('totalPriceText').innerText = "฿" + (currentPrice * currentQty);
        }
        function confirmOrder() {
            alert("เพิ่ม " + currentItemName + " (" + currentQty + " จาน) ลงในรายการแล้ว");
            closeModal();
        }
        window.onclick = function(e) { if (e.target == document.getElementById('orderModal')) closeModal(); }
    </script>
</body>
</html>
